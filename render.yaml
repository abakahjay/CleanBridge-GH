# Render Blueprint: CleanBridge GH frontend as a static site.
# The API is the existing FullBackendd web service (https://fullbackendd.onrender.com).
services:
  - type: web
    name: cleanbridge-gh
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: artifacts/cleanbridge-gh/dist
    envVars:
      - key: VITE_API_URL
        value: https://fullbackendd.onrender.com
      - key: NODE_VERSION
        value: "24"
    routes:
      # Single-page app: let the client router handle every path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The service worker must always be re-checked so app updates roll out.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /.well-known/*
        name: Content-Type
        value: application/json
      # Android app download (installed directly, outside Google Play).
      - path: /downloads/*.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*.apk
        name: Content-Disposition
        value: attachment; filename="CleanBridge-GH.apk"
