<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CleanBridge GH · Offline</title>
  <meta name="theme-color" content="#1B2D2F" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1B2D2F; color: #fbf8f1; font-family: Arial, Helvetica, sans-serif; text-align: center; }
    .card { max-width: 340px; padding: 24px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { color: rgba(251, 248, 241, .7); line-height: 1.55; }
    button { margin-top: 12px; padding: 11px 18px; border: 0; border-radius: 10px; background: #F4B948; color: #1B2D2F; font-weight: bold; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You’re offline</h1>
    <p>CleanBridge needs an internet connection to book pickups and track collectors. Check your data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
